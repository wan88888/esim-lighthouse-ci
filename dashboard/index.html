<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>eSIM Lighthouse CI - 趋势看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    color: #f8fafc;
    margin-bottom: 4px;
  }
  .header p {
    font-size: 0.875rem;
    color: #94a3b8;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .tab:hover { border-color: #475569; color: #e2e8f0; }
  .tab.active {
    background: #334155;
    color: #f8fafc;
    border-color: #3b82f6;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    max-width: 800px;
    margin: 0 auto 32px;
  }

  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    border: 1px solid #334155;
  }
  .card .label {
    font-size: 0.75rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .card .score {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }
  .card .threshold {
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 4px;
  }
  .card .delta {
    font-size: 0.75rem;
    margin-top: 4px;
    font-weight: 600;
  }
  .delta-up { color: #34d399; }
  .delta-down { color: #f87171; }
  .delta-flat { color: #64748b; }
  .card .status {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .pass { background: #064e3b; color: #34d399; }
  .fail { background: #7f1d1d; color: #fca5a5; }
  .score-green { color: #34d399; }
  .score-red { color: #f87171; }

  .chart-container {
    max-width: 900px;
    margin: 0 auto;
    background: #1e293b;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #334155;
  }

  .meta {
    text-align: center;
    margin-top: 24px;
    font-size: 0.75rem;
    color: #475569;
  }
  .meta a { color: #64748b; }

  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: #64748b;
  }
  .empty-state h2 { color: #94a3b8; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>eSIM 网站性能监控</h1>
  <p id="subtitle">Loading...</p>
</div>

<div id="tabs" class="tabs"></div>
<div id="cards" class="cards"></div>

<div class="chart-container">
  <canvas id="trendChart"></canvas>
</div>

<div class="meta" id="meta"></div>

<div class="empty-state" id="empty" style="display:none">
  <h2>No Data Yet</h2>
  <p>Scores will appear here after the first Lighthouse CI run.</p>
</div>

<script>
const METRIC_CONFIG = [
  { key: 'performance',    label: 'Performance',    color: '#f97316', pointStyle: 'circle',   dash: [] },
  { key: 'accessibility',  label: 'Accessibility',  color: '#3b82f6', pointStyle: 'triangle', dash: [] },
  { key: 'best-practices', label: 'Best Practices', color: '#a855f7', pointStyle: 'rect',     dash: [6, 3] },
  { key: 'seo',            label: 'SEO',            color: '#22c55e', pointStyle: 'star',     dash: [2, 2] },
];

let rawData = [];
let chartInstance = null;

async function init() {
  try {
    const resp = await fetch('scores.json');
    if (!resp.ok) throw new Error(resp.status);
    rawData = await resp.json();
  } catch {
    document.querySelector('.chart-container').style.display = 'none';
    document.querySelector('.cards').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('subtitle').textContent = '';
    return;
  }

  if (!rawData.length) {
    document.querySelector('.chart-container').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('subtitle').textContent = '';
    return;
  }

  const latest = rawData[rawData.length - 1];
  const latestDate = new Date(latest.date);
  document.getElementById('subtitle').textContent =
    `Last run: ${latestDate.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}` +
    (latest.commit !== 'local' ? ` · ${latest.commit}` : '');

  const pageNames = getPageNames();
  renderTabs(pageNames);
  switchPage(pageNames[0]);
  renderMeta();
}

/** Collect all unique page names across entries, skipping legacy "default" */
function getPageNames() {
  const nameSet = new Set();
  for (const entry of rawData) {
    if (entry.pages) {
      Object.keys(entry.pages).forEach(k => nameSet.add(k));
    }
  }
  return [...nameSet];
}

/** Get scores for a specific page from an entry */
function getPageScores(entry, pageName) {
  return entry.pages?.[pageName] ?? null;
}

function renderTabs(pageNames) {
  const container = document.getElementById('tabs');
  if (pageNames.length <= 1) {
    container.style.display = 'none';
    return;
  }
  container.innerHTML = pageNames.map((name, i) =>
    `<div class="tab${i === 0 ? ' active' : ''}" data-page="${name}">${name}</div>`
  ).join('');
  container.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    switchPage(tab.dataset.page);
  });
}

function switchPage(pageName) {
  const latest = rawData[rawData.length - 1];
  renderCards(latest, pageName);
  renderChart(pageName);
}

function renderCards(latest, pageName) {
  const scores = getPageScores(latest, pageName);
  const container = document.getElementById('cards');
  if (!scores) { container.innerHTML = ''; return; }

  // Find previous entry for delta
  let prevScores = null;
  for (let i = rawData.length - 2; i >= 0; i--) {
    const s = getPageScores(rawData[i], pageName);
    if (s) { prevScores = s; break; }
  }

  container.innerHTML = METRIC_CONFIG.map(m => {
    const score = scores[m.key] ?? 0;
    const threshold = latest.thresholds?.[m.key] ?? 0;
    const pass = score >= threshold;
    const op = threshold >= 100 ? '=' : '≥';

    let deltaHtml = '';
    if (prevScores) {
      const prev = prevScores[m.key];
      if (prev != null) {
        const diff = score - prev;
        if (diff > 0) deltaHtml = `<div class="delta delta-up">▲ +${diff}</div>`;
        else if (diff < 0) deltaHtml = `<div class="delta delta-down">▼ ${diff}</div>`;
        else deltaHtml = `<div class="delta delta-flat">— 0</div>`;
      }
    }

    return `
      <div class="card">
        <div class="label">${m.label}</div>
        <div class="score ${pass ? 'score-green' : 'score-red'}">${score}</div>
        ${deltaHtml}
        <div class="threshold">Threshold ${op} ${threshold}</div>
        <span class="status ${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</span>
      </div>`;
  }).join('');
}

function renderChart(pageName) {
  const filtered = rawData.filter(d => getPageScores(d, pageName));
  const labels = filtered.map(d => {
    const dt = new Date(d.date);
    return `${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getDate().toString().padStart(2,'0')}`;
  });

  const datasets = METRIC_CONFIG.map(m => ({
    label: m.label,
    data: filtered.map(d => {
      const s = getPageScores(d, pageName);
      return s?.[m.key] ?? null;
    }),
    borderColor: m.color,
    backgroundColor: m.color + '1a',
    borderWidth: 2,
    borderDash: m.dash,
    pointStyle: m.pointStyle,
    pointRadius: filtered.length > 30 ? 0 : 4,
    pointHoverRadius: 6,
    tension: 0.3,
    fill: false,
  }));

  const allValues = datasets.flatMap(ds => ds.data).filter(v => v != null);
  const minVal = allValues.length ? Math.min(...allValues) : 0;
  const yMin = Math.max(0, Math.floor(minVal / 10) * 10 - 10);
  const yMax = 105;

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: '#94a3b8', usePointStyle: true, padding: 16 },
        },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#f8fafc',
          bodyColor: '#e2e8f0',
          borderColor: '#334155',
          borderWidth: 1,
          padding: 12,
          callbacks: {
            title(items) {
              const d = filtered[items[0].dataIndex];
              const dt = new Date(d.date);
              return dt.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }) +
                (d.commit !== 'local' ? `  ·  ${d.commit}` : '');
            },
            label(item) {
              return ` ${item.dataset.label}: ${item.raw}`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#64748b', maxRotation: 0 },
          grid: { color: '#1e293b' },
        },
        y: {
          min: yMin, max: yMax,
          ticks: { color: '#64748b', stepSize: 5 },
          grid: { color: '#334155' },
        },
      },
    },
  });
}

function renderMeta() {
  document.getElementById('meta').innerHTML =
    `Total runs: ${rawData.length} · Data retained: last 100 runs · ` +
    `<a href="scores.json" target="_blank">Raw JSON</a>`;
}

init();
</script>
</body>
</html>
