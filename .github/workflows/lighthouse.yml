name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周三凌晨 06:37 (北京时间) = UTC 周二 22:37
    - cron: '37 22 * * 2'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse Collect
        run: |
          LHCI_BUILD_CONTEXT__CURRENT_HASH=github-actions \
          lhci collect --config=lighthouserc.js || true

      - name: Run Lighthouse Assert
        run: |
          LHCI_BUILD_CONTEXT__CURRENT_HASH=github-actions \
          lhci assert --config=lighthouserc.js || true

      - name: Run Lighthouse Upload
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LHCI_BUILD_CONTEXT__CURRENT_HASH=github-actions \
          lhci upload --config=lighthouserc.js 2>&1 | tee upload_output.txt || true

      - name: Fetch Score History
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null && \
            git show origin/gh-pages:scores.json > scores_history.json 2>/dev/null || \
            echo '[]' > scores_history.json

      - name: Analyze Scores & Notify Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: node scripts/notify-feishu.js

      - name: Prepare Dashboard Data
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        run: |
          mkdir -p .dashboard-build
          cp scores_history.json .dashboard-build/scores.json
          node scripts/save-scores.js .dashboard-build
          cp dashboard/index.html .dashboard-build/index.html

      - name: Deploy Dashboard
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .dashboard-build
          commit_message: 'Update Lighthouse scores'
